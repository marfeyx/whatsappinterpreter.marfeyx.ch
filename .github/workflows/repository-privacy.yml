name: Repository privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-and-identities:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history for secrets
        shell: bash
        run: >-
          "$RUNNER_TEMP/gitleaks" git .
          --log-opts="--all --full-history"
          --redact --no-banner --ignore-gitleaks-allow
      - name: Require private email addresses in new commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git log "$HEAD_SHA" "^$BASE_SHA" --format='%ae%n%ce' > "$RUNNER_TEMP/commit-emails"
          else
            git log -1 "$HEAD_SHA" --format='%ae%n%ce' > "$RUNNER_TEMP/commit-emails"
          fi
          python3 -c '
          import re, sys
          addresses = set(sys.stdin.read().splitlines())
          allowed = re.compile(r"(?:[^@\s]+@users\.noreply\.github\.com|noreply@github\.com)", re.I)
          if any(not allowed.fullmatch(address) for address in addresses):
              print("New commit metadata contains a non-noreply email. Configure a GitHub noreply address; see REPOSITORY_PRIVACY.md.")
              sys.exit(1)
          print("New commit emails use GitHub noreply addresses.")' < "$RUNNER_TEMP/commit-emails"
